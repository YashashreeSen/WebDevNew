<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment form</title>
    <style>
        *{
            font-family: Arial, sans-serif;
            box-sizing: content-box;
        
        }
        body{
            background-color: #d2c9c9cc;
            padding: 15px;
            margin: 15px 30px;
            font-size: 14px;
        }
        .container{
            background-color: azure;
            width: 75%;
            margin: auto;
            padding: 10px;
        }
        input[type="text"], input[type="password"], input[type="number"], input[type="date"]{
            width: 80%;
            padding: 10px;
            margin: 5px ;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .main_heading{
            text-align: center;
            
        }
        input[type="submit"]{
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width:75px;
            
        }
    </style>
</head>
<body>
    <div class="container">
        
            <form action = "https://www.google.com">
                <h1 class="main_heading">Payment form</h1>
                <hr>
            <h2>contact info</h2>
            <hr>
            <p>Required feilds are marked as *</p>
            <p>Name: *<input type="text" name="name" required placeholder="Enter your name"></p>
                <p>Password:<input type="password" required placeholder="Enter your password"></p>
                <p>Male <input type="radio" name = "gender" id=""></p>
                <p>Female <input type ="radio" name="gender" id=""></p>
                <p>document as :</p>
                <p> Aadhar card <input type="checkbox" name="document1" id="text"></p>
                <p> PAN card <input type="checkbox" name="document2" id="text"></p>
                <p> Ration card <input type="checkbox" name="document3" id="text"></p>
                <p> Voter card <input type="checkbox" name="document4" id="text"></p>
                <p>card options:
                
                <select name="card_type" id="card_type">
                        <option value=""> --select a card type--</option>
                        <option value="visa"> Visa</option>
                        <option value="rupay">Rupay</option>
                    </select>
                </p>
                <p>
                    card number <input type="number" name="card_number" id="card number" placeholder="Enter card number">
                </p>
                <p>
                    expiration date <input type="date" name="exp_date" id="exp_date">
                </p>
<p>
    <input type="submit" value="Pay Now">
</p>

</body>
</html>
